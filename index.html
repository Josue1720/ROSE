
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Britney 🌹</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(
        ellipse at 50% 72%,
        #361025 0%,
        #150817 48%,
        #07050c 100%
      );
      color: #ffe6ed;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .stars, .petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #ffd8e6;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    .heading {
      position: absolute;
      top: 8%;
      width: 100%;
      text-align: center;
      z-index: 20;
      padding: 0 16px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      margin: 0;
      text-shadow: 0 0 28px #f34a77;
    }

    .heading p {
      font-family: Arial, sans-serif;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 0.2em;
      color: #f6a9bc;
    }

    .garden {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(850px, 100%);
      height: 76%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(5px, 2vw, 24px);
    }

    .flower {
      position: relative;
      width: 22%;
      height: var(--height);
      transform-origin: bottom center;
      animation: sway var(--speed) ease-in-out infinite alternate;
      filter: drop-shadow(0 0 18px #b5094055);
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 9px;
      height: calc(100% - 85px);
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #103c26,
        #399553 45%,
        #0d432c
      );
      transform: translateX(-50%);
      animation: grow 2.2s ease-out both;
    }

    .leaf {
      position: absolute;
      width: 65px;
      height: 30px;
      background: linear-gradient(135deg, #2d9d54, #0a452e);
      border-radius: 0 100% 0 100%;
      box-shadow: inset 2px 2px 6px #6cda8360;
      transform-origin: 0 100%;
      opacity: 0;
      animation: leafIn 0.9s ease-out forwards;
    }

    .leaf.one {
      bottom: 31%;
      left: 52%;
      transform: rotate(-27deg);
      animation-delay: 1.6s;
    }

    .leaf.two {
      bottom: 47%;
      right: 48%;
      transform: scaleX(-1) rotate(-30deg);
      animation-delay: 1.9s;
    }

    .leaf.three {
      bottom: 18%;
      right: 48%;
      transform: scaleX(-1) rotate(-20deg);
      animation-delay: 2.2s;
    }

    .rose {
      position: absolute;
      top: 0;
      left: 50%;
      width: 150px;
      height: 155px;
      transform: translateX(-50%) scale(0.08);
      transform-origin: center 80%;
      animation: bloom 2.8s cubic-bezier(.16,.85,.25,1.1) forwards;
      animation-delay: var(--delay);
    }

    .rose::after {
      content: "";
      position: absolute;
      bottom: 9px;
      left: 43px;
      width: 64px;
      height: 26px;
      border-radius: 50%;
      background: #7d062b;
      filter: blur(12px);
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 76px;
      height: 100px;
      margin-left: -38px;
      margin-top: -60px;
      border-radius: 55% 55% 42% 42%;
      background: radial-gradient(
        ellipse at 35% 20%,
        #ff637e 0%,
        #e41149 37%,
        #930020 80%
      );
      border: 1px solid #ff668355;
      box-shadow:
        inset -9px -8px 18px #5e001f77,
        0 0 14px #d90c3d33;
      transform-origin: 50% 88%;
      transform: rotate(var(--r))
                 translateY(var(--y))
                 scale(var(--s));
    }

    .petal:nth-child(1) {
      --r: -65deg; --y: -13px; --s: 1.05;
    }

    .petal:nth-child(2) {
      --r: 65deg; --y: -13px; --s: 1.05;
    }

    .petal:nth-child(3) {
      --r: -35deg; --y: -20px; --s: .95;
    }

    .petal:nth-child(4) {
      --r: 35deg; --y: -20px; --s: .95;
    }

    .petal:nth-child(5) {
      --r: 0deg; --y: -26px; --s: .92;
    }

    .petal:nth-child(6) {
      --r: -18deg; --y: -31px; --s: .7;
    }

    .petal:nth-child(7) {
      --r: 22deg; --y: -33px; --s: .68;
    }

    .petal:nth-child(8) {
      --r: 0deg; --y: -35px; --s: .48;
      background: radial-gradient(
        circle at 35% 25%,
        #ff9aaa,
        #ec174c 60%,
        #79001d
      );
    }

    .falling {
      position: absolute;
      width: 17px;
      height: 24px;
      background: linear-gradient(135deg, #ff4569, #990025);
      border-radius: 80% 10% 75% 20%;
      opacity: .8;
      animation: fall linear infinite;
      filter: drop-shadow(0 0 6px #ff2e65);
    }

    .ground {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 125px;
      border-radius: 50%;
      background: #a30b3a20;
      filter: blur(35px);
    }

    .hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #d78aa2;
      font: 12px Arial, sans-serif;
      letter-spacing: .12em;
      z-index: 20;
      padding: 0 15px;
    }

    button {
      background: transparent;
      color: #ffc4d4;
      border: 1px solid #a84465;
      border-radius: 30px;
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 14px;
      transition: .2s;
    }

    button:hover {
      background: #a5234a66;
      transform: translateY(-2px);
    }

    @keyframes bloom {
      0% {
        transform: translateX(-50%) scale(.08) rotate(-18deg);
        opacity: 0;
      }
      55% { opacity: 1; }
      100% {
        transform: translateX(-50%) scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes grow {
      from { height: 0; }
      to { height: calc(100% - 85px); }
    }

    @keyframes leafIn {
      to { opacity: 1; }
    }

    @keyframes sway {
      from { transform: rotate(-4deg); }
      to { transform: rotate(4deg); }
    }

    @keyframes twinkle {
      from {
        opacity: .15;
        transform: scale(.7);
      }
      to {
        opacity: 1;
        transform: scale(1.6);
      }
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -50px, 0) rotate(0);
        opacity: 0;
      }
      10% { opacity: .85; }
      90% { opacity: .8; }
      100% {
        transform: translate3d(130px, 105vh, 0) rotate(650deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .garden {
        height: 67%;
        gap: 0;
      }
      .flower { width: 30%; }
      .rose { zoom: .75; }
      .leaf {
        width: 45px;
        height: 23px;
      }
      .heading { top: 10%; }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="stars" id="stars"></div>
    <div class="petals" id="petals"></div>

    <div class="heading">
      <h1>For Britney 🌹</h1>
      <p>EVERY ROSE BLOOMS FOR YOU ❤️</p>
      <button id="replay">🌹 Bloom Again</button>
    </div>

    <div class="ground"></div>
    <div class="garden" id="garden"></div>

    <div class="hint">
      A little garden, just for Britney ♥
    </div>
  </main>

  <script>
    const garden = document.getElementById("garden");
    const stars = document.getElementById("stars");
    const petals = document.getElementById("petals");

    const flowers = [
      { h: 63, d: .4,  s: 5.2 },
      { h: 80, d: .9,  s: 4.6 },
      { h: 95, d: .2,  s: 5.8 },
      { h: 75, d: 1.2, s: 4.9 },
      { h: 68, d: .65, s: 5.4 }
    ];

    // Create blooming red roses
    function plant() {
      garden.innerHTML = "";

      flowers.forEach((f, i) => {
        const flower = document.createElement("div");
        flower.className = "flower";

        flower.style.cssText = `
          --height: ${f.h}%;
          --delay: ${f.d}s;
          --speed: ${f.s}s;
          z-index: ${10 - Math.abs(i - 2)};
        `;

        flower.innerHTML = `
          <div class="stem"></div>
          <div class="leaf one"></div>
          <div class="leaf two"></div>
          <div class="leaf three"></div>
          <div class="rose">
            ${Array.from(
              { length: 8 },
              () => '<div class="petal"></div>'
            ).join("")}
          </div>
        `;

        garden.appendChild(flower);
      });
    }

    // Create twinkling stars
    for (let i = 0; i < 95; i++) {
      const star = document.createElement("span");
      star.className = "star";

      star.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 82}%;
        animation-delay: ${Math.random() * 5}s;
        animation-duration: ${2 + Math.random() * 4}s;
      `;

      stars.appendChild(star);
    }

    // Create falling rose petals
    for (let i = 0; i < 24; i++) {
      const petal = document.createElement("span");
      petal.className = "falling";

      petal.style.cssText = `
        left: ${Math.random() * 100}%;
        top: -40px;
        animation-delay: ${-Math.random() * 18}s;
        animation-duration: ${9 + Math.random() * 12}s;
      `;

      petals.appendChild(petal);
    }

    // Replay the blooming animation
    document.getElementById("replay")
      .addEventListener("click", plant);

    // Start the garden
    plant();
  </script>
</body>
</html>
